services:
  mailcatcher:
    image: dockage/mailcatcher
    container_name: mailcatcher
    ports:
      - 11025:1025
      - 11080:1080
    restart: on-failure:10
    networks:
      inner:
        aliases:
          - mailcatcher
  miserend:
    build:
      context: ..
      dockerfile: docker/miserend/Dockerfile.test
    environment:
      - SMTP_HOST=mailcatcher
      # A 11025 a hoston publikált port; a compose-hálózaton belül a mailcatcher 1025-ön hallgat.
      - SMTP_PORT=1025
      - MISEREND_WEBAPP_ENVIRONMENT=testing
      # A funkcionális tesztek a valódi oldalt töltik be; a templom-oldal külső
      # szolgáltatásokat hívna (kozossegek.hu, Overpass), ami üres cache-sel másodperceket
      # vesz és a CI-ban időtúllépést okozott. Teszt alatt nincs kifelé menő hálózat.
      - EXTERNAL_APIS_OFFLINE=1
      # A böngésző www-data-ként indul, akinek a HOME-ja (/var/www) NEM írható. A
      # Chromium ilyenkor a saját adatkönyvtárát sem tudja létrehozni, és rögtön
      # kilép: "Failed to create headless user data directory container" — a
      # Panther pedig ezt "session not created: Chrome instance exited"-ként
      # jelenti, minden egyes teszten. Írható HOME-mal elindul.
      - HOME=/tmp
