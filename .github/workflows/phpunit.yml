name: PHPUnit

on:
  pull_request:
  workflow_run:
    workflows: ["🐳 Build & publish app image"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to publish (e.g. 2026.2.8, ci, test)"
        required: true
        default: latest

# A futás ragadjon be helyett bukjon el, és egy ág egyszerre csak egyszer fusson.
#
# Két baj volt egyszerre:
#  1. Nincs `concurrency`, ezért új pusholás NEM állította le a korábbi futást. Egy
#     beragadt job így a GitHub 6 órás alaplimitjéig lógott, foglalta a sort, és a
#     PR-en „függőben" maradt az ellenőrzés akkor is, ha az új futás már zöld volt.
#  2. Nincs `timeout-minutes`, ezért a beakadás nem is derült ki: a funkcionális
#     (Panther/Chrome) lépés normálisan ~80 másodperc, beragadva viszont órákig ült.
#
# `cancel-in-progress: true` — itt szándékosan más, mint a deploy-workflow-knál: ott
# a félbehagyott deploy sérült állapotot hagyna, egy tesztfutás megszakítása viszont
# ártalmatlan.
concurrency:
  group: phpunit-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_FILES: -f docker/compose.yml -f docker/compose.dev.yml -f docker/compose.coverage.yml
  TEST_RESULTS_PATH: ${{ github.workspace }}

jobs:
  phpunit:
    runs-on: ubuntu-latest
    # Az egész job felső korlátja; a sikeres futás ma ~5 perc.
    timeout-minutes: 30
    # Only run if workflow_run was successful or if triggered by other events
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Determine ref and tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "REF=${{ github.ref }}" >> "$GITHUB_OUTPUT"
            echo "TAG=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            # Use the exact commit and tag from the workflow_run event
            echo "REF=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "TAG=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            # A refs/pull/<id>/merge ref eltűnik, amint a PR-t merge-ölik vagy lezárják.
            # A head commit továbbra is elérhető, ezért a már sorban álló futás is
            # biztonságosan checkoutolható.
            echo "REF=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
            echo "TAG=latest" >> "$GITHUB_OUTPUT"
          else
            # Other events
            echo "REF=${{ github.ref }}" >> "$GITHUB_OUTPUT"
            echo "TAG=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.REF }}

      - name: Set up test directories
        run: |
          mkdir -p "${{ github.workspace }}/test-results/coverage/html"
          chmod -R 777 "${{ github.workspace }}/test-results" || true

      - name: Start application stack
        env:
          COVERAGE_IMAGE_TAG: ${{ steps.tag.outputs.TAG }}
        run: |
          docker compose $COMPOSE_FILES up -d

      - name: Wait for application
        run: |
            timeout 300 bash -c 'until curl -fsS http://127.0.0.1:8000/ > /dev/null 2>&1; do sleep 2; done'

      # Az Elasticsearch lassabban áll fel mint a webapp (JVM + cluster-init), és
      # a fenti "Wait for application" csak a :8000-t várja. Az ES-t igénylő
      # tesztek ezért versenyeznek az ES bootjával ("Failed to connect to
      # elasticsearch port 9200"). Itt megvárjuk, míg az ES legalább `yellow`.
      - name: Wait for Elasticsearch
        run: |
            timeout 300 bash -c 'until curl -fsS "http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s" > /dev/null 2>&1; do sleep 3; done'

      - name: Run PHPUnit tests
        env:
          COVERAGE_IMAGE_TAG: ${{ steps.tag.outputs.TAG }}
        run: |
            docker compose $COMPOSE_FILES exec -T miserend /miserend/webapp/vendor/bin/phpunit \
            -c /miserend/webapp/tests/phpunit.xml \
            --coverage-html /miserend/test-results/coverage/html \
            --log-junit /miserend/test-results/unit-junit.xml \
            --coverage-cobertura /miserend/test-results/coverage/cobertura.xml

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer

      - name: Verify browser tooling
        run: |
          command -v google-chrome || command -v chromium || command -v chromium-browser
          command -v chromedriver

      - name: Install functional test dependencies
        working-directory: webapp
        env:
          COMPOSER_VENDOR_DIR: ${{ github.workspace }}/test-results/functional-vendor
        run: |
          mkdir -p "${COMPOSER_VENDOR_DIR}"
          if grep -q '"symfony/panther"' composer.lock; then
            composer install --no-interaction --prefer-dist
          else
            composer update --no-interaction --prefer-dist symfony/panther --with-all-dependencies
          fi

      - name: Run functional tests
        # Normálisan ~80 másodperc. Ha a böngésző beakad, itt bukjon el, ne a job
        # felső korlátjánál — így a Docker-naplós lépés is lefut és látszik az ok.
        timeout-minutes: 12
        working-directory: webapp/tests
        env:
          PANTHER_EXTERNAL_BASE_URI: http://127.0.0.1:8000
          PANTHER_NO_SANDBOX: 1
          FUNCTIONAL_VENDOR_AUTOLOAD: ${{ github.workspace }}/test-results/functional-vendor/autoload.php
        run: |
          export PANTHER_CHROME_BINARY="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "${{ github.workspace }}/test-results/functional-vendor/bin/phpunit" \
            -c phpunit.functional.xml \
            --log-junit "${{ github.workspace }}/test-results/functional-junit.xml"

      - name: Inspect test result files
        if: always()
        env:
          COVERAGE_IMAGE_TAG: ${{ steps.tag.outputs.TAG }}
        run: |
          echo "Host test-results files:"
          find "${{ github.workspace }}/test-results" -maxdepth 3 -type f | sort || true
          echo "Container test-results files:"
          docker compose $COMPOSE_FILES exec -T miserend sh -lc 'find /miserend/test-results -maxdepth 3 -type f | sort' || true

      - name: Show Docker logs on failure
        if: failure()
        env:
          COVERAGE_IMAGE_TAG: ${{ steps.tag.outputs.TAG }}
        run: |
            docker compose $COMPOSE_FILES logs

      - name: Upload coverage HTML
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: phpunit-coverage-html
          path: ${{ github.workspace }}/test-results/coverage/html
          if-no-files-found: warn

      - name: Upload cobertura XML
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: phpunit-coverage-cobertura
          path: ${{ github.workspace }}/test-results/coverage/cobertura.xml
          if-no-files-found: warn

      - name: Publish Unit Test Report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: |
            ${{ github.workspace }}/test-results/unit-junit.xml
          fail_on_failure: false
          detailed_summary: true
          include_passed: false
          annotate_only: true
          check_name: Unit Tests (PHPUnit)
          job_name: Unit Tests

      - name: Publish Functional Test Report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: |
            ${{ github.workspace }}/test-results/functional-junit.xml
          fail_on_failure: false
          detailed_summary: true
          include_passed: false
          annotate_only: true
          check_name: Functional Tests (Panther)
          job_name: Functional Tests

      - name: Stop application stack
        if: always()
        env:
          COVERAGE_IMAGE_TAG: ${{ steps.tag.outputs.TAG }}
        run: |
            docker compose $COMPOSE_FILES down -v
