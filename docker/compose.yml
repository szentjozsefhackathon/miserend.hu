# #532: a projekt-nevet a top-level `name:` adja (docker compose spec). Ez prefixeli
# a containereket, a volume-okat és a hálózatot — így ugyanez a compose-rendszer több
# példányban futhat egy szerveren (pl. prod + staging) ütközés nélkül. A portokat és az
# image-taget külön env-változó paraméterezi (default = a mostani érték → dev változatlan).
# Docs: https://docs.docker.com/reference/compose-file/version-and-name/
name: ${PROJECT:-miserend}

services:
  tmp-init:
    image: busybox
    volumes:
      - tmp:/data
    command: sh -c "chown -R 33:33 /data"
    restart: "no"
  data-init:
    image: ghcr.io/szentjozsefhackathon/miserend-elasticsearch-data:2026.4.18
    volumes:
      - elasticsearch_data:/data
    restart: "no"
  mysql:
    image: mariadb:12
    platform: linux/amd64
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql/initdb.d:/docker-entrypoint-initdb.d
      - ./mysql/mysql.conf.d:/etc/mysql/mysql.conf.d
    ports:
      - ${MYSQL_PORT:-3306}:3306
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: pw
      MYSQL_DATABASE: miserend
    healthcheck:
      test: [CMD, mariadb-admin, ping, -h, localhost, -u, user, -ppw]
      timeout: 5s
      retries: 10
    networks:
      inner:
        aliases:
          - mysql
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.1
    entrypoint: ["/entrypoint-wrapper.sh"]
    command: ["eswrapper"]
    # #557: az ES-nek eddig NEM volt restart-policyja (a mysql/miserend-nek igen),
    # ezért ha elhalt (crash/OOM), halva maradt, amíg valaki kézzel újra nem indította
    # → a keresés leállt. Az always-szel a docker magától visszahozza.
    restart: always
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
      - cluster.name=miserend
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - ${ES_HTTP_PORT:-9200}:9200
      - ${ES_TCP_PORT:-9300}:9300
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
      - ./elasticsearch/entrypoint.sh:/entrypoint-wrapper.sh:ro
    networks:
      inner:
        aliases:
          - elasticsearch
    # Az ES lassan áll fel (JVM + cluster-init); a "started" (process indul) != "kész".
    # A healthcheck a 9200-on `yellow` cluster-státuszt vár, hogy a rá-épülő miserend
    # (és így a tesztek) csak akkor induljanak, ha az ES tényleg fogadja a kéréseket.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s' > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
  miserend:
    image: ${MISEREND_IMAGE:-localhost/miserend:latest}
    volumes:
       - ../webapp:/miserend/webapp
       - vendor_data:/miserend/webapp/vendor
       - node_modules_data:/miserend/webapp/node_modules    
       - tmp:/miserend/webapp/fajlok/tmp
       - ./miserend/apache/ports.conf:/etc/apache2/ports.conf

    ports:
      - ${APP_PORT:-8000}:8000
    user: "www-data"
    restart: "always"
    depends_on:
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

    # #610: az SMTP-beállításokat át KELL adni a konténernek. A `.env` önmagában csak a
    # compose-fájl interpolációjához kell, a PHP-hez nem jut el belőle semmi. Enélkül a
    # config.php alapértéke érvényesült, ami a dev mailcatcher-be küldött minden levelet.
    # A `.env` a compose.yml mellé (docker/.env) kerül.
    environment:
      - MISEREND_WEBAPP_ENVIRONMENT=production
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-25}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_SECURE=${SMTP_SECURE:-}
      - OSM_URL=${OSM_URL:-}
      - OSM_CLIENT=${OSM_CLIENT:-}
      - OSM_CLIENT_SECRET=${OSM_CLIENT_SECRET:-}
      - OSM_APPLICATION_CODE=${OSM_APPLICATION_CODE:-}
      - OSM_ACCESS_TOKEN=${OSM_ACCESS_TOKEN:-}

    networks:
      inner:
        aliases:
          - miserend
networks:
  inner:
    driver: bridge
volumes:
  db_data: {}
  elasticsearch_data: {}
  tmp: {}
  vendor_data:
  node_modules_data:
  