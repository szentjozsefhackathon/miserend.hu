name: Selenium E2E Tests

on:
  pull_request:
  push:
  workflow_dispatch:

env:
  APP_IMAGE: localhost/miserend.hu:selenium-test

jobs:
  selenium-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build app image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/miserend/Dockerfile.github
          load: true
          push: false
          tags: ${{ env.APP_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create Docker Compose CI override
        run: |
          cat > docker/compose.selenium.yml <<'EOF'
          services:
            miserend:
              image: localhost/miserend.hu:selenium-test
          EOF

      - name: Start application stack
        run: |
          docker compose -f docker/compose.yml -f docker/compose.selenium.yml up -d

      - name: Wait for application
        run: |
          timeout 120 bash -c 'until curl -fsS http://localhost:8000/ > /dev/null; do sleep 2; done'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Selenium test dependencies
        working-directory: selenium-test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Selenium tests
        working-directory: selenium-test
        env:
          TEST_ENV: local
        run: |
          python -m pytest

      - name: Show Docker logs on failure
        if: failure()
        run: |
          docker compose -f docker/compose.yml -f docker/compose.selenium.yml logs

      - name: Stop application stack
        if: always()
        run: |
          docker compose -f docker/compose.yml -f docker/compose.selenium.yml down -v
