name: Selenium E2E Tests

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to test"
        required: true
        default: "2026.4.18"

env:
  IMAGE_NAME: ghcr.io/szentjozsefhackathon/miserend.hu
  IMAGE_TAG: ${{ inputs.image_tag || '2026.4.18' }}
  LOCAL_IMAGE: localhost/miserend.hu:latest


jobs:
  selenium-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull app image
        run: |
          docker pull $IMAGE_NAME:$IMAGE_TAG

      - name: Tag app image for compose
        run: |
          docker tag $IMAGE_NAME:$IMAGE_TAG $LOCAL_IMAGE

      - name: Start application stack
        run: |
          docker compose -f docker/compose.yml -f docker/compose.dev.yml up -d

      - name: Wait for application
        run: |
          timeout 120 bash -c 'until curl -fsS http://localhost:8000/ > /dev/null; do sleep 2; done'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Selenium test dependencies
        working-directory: selenium-test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Selenium tests
        working-directory: selenium-test
        env:
          TEST_ENV: local
        run: |
          python -m pytest

      - name: Show Docker logs on failure
        if: failure()
        run: |
          docker compose -f docker/compose.yml -f docker/compose.dev.yml logs

      - name: Stop application stack
        if: always()
        run: |
          docker compose -f docker/compose.yml -f docker/compose.dev.yml down -v
