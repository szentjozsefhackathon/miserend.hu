    Listen 8000
    <VirtualHost *:8000>
        DocumentRoot "/miserend/webapp"
        # php_admin_value sendmail_path "/home/vagrant/.rbenv/shims/catchmail -f test@miserend.hu --smtp-ip 0.0.0.0"
        <Directory "/miserend/webapp">
            # SetEnv MISEREND_WEBAPP_ENVIRONMENT staging
            AllowOverride All
            Require all granted
        </Directory>

        # #750: adatbázis-felület SOHA ne szolgálódjon ki a docrootból.
        #
        # A `webapp/adminer.php` be volt commitolva (Adminer 5.4.1), az image-be is
        # bekerült, a docroot pedig `Require all granted` — tehát a /adminer.php
        # publikusan kiszolgált egy teljes adatbázis-kezelő belépőt. Magát a fájlt
        # törlöm, de ez a réteg attól függetlenül is kell: az eddigi szokás az volt,
        # hogy nézelődéshez kézzel bemásolták, és a végén illett letörölni.
        # Innentől a bemásolt példány sem érhető el kívülről.
        #
        # Helyette: docker/compose.adminer.yml (opt-in profil, csak 127.0.0.1,
        # SSH-tunnellel).
        <FilesMatch "(?i)^(adminer|phpmyadmin|pma|dbadmin)[^/]*\.php$">
            Require all denied
        </FilesMatch>

        # #375: a templom-képekre engedékeny CORS, hogy külső oldal (pl. a
        # templom-terkep) canvasra rajzolhassa és plakátként exportálhassa őket
        # (a "tainted canvas" hiba elkerülése). Csak a publikus kép-könyvtárra.
        <Directory "/miserend/webapp/kepek">
            <IfModule mod_headers.c>
                Header set Access-Control-Allow-Origin "*"
            </IfModule>

            # #709: a képkönyvtárból CSAK kép szolgálható ki.
            #
            # Valaki kép helyett .php fájlt töltött fel, és a közvetlen URL-jén az
            # Apache LEFUTTATTA. Ez távoli kódfuttatás. A feltöltés oldalát külön
            # javítom, de ez a réteg attól függetlenül is kell: a már feltöltött
            # fájlokat is hatástalanítja, és megvéd akkor is, ha a feltöltésbe
            # később visszacsúszik egy hiba.
            #
            # Fehérlista, nem feketelista: nem azt soroljuk fel, mi tiltott (abból
            # mindig kimarad valami — .phar, .phtml, .php8, .inc), hanem azt, mi
            # engedett. A bmp azért van bent, mert 106 régi kép ilyen.
            <FilesMatch ".">
                Require all denied
            </FilesMatch>
            <FilesMatch "(?i)\.(jpe?g|png|gif|bmp|webp)$">
                Require all granted
            </FilesMatch>

            # Öv és nadrágtartó: ha valamiért mégis kiszolgálódna, ne értelmezze.
            <IfModule mod_php.c>
                php_admin_flag engine off
            </IfModule>
            RemoveHandler .php .phtml .phar .php3 .php4 .php5 .php7 .php8 .inc
            RemoveType .php .phtml .phar .php3 .php4 .php5 .php7 .php8 .inc
        </Directory>
    </VirtualHost>